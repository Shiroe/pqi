[project]
name = "pqi"
version = "0.1.0"
description = "Polymarket Qualitative Intelligence — 7-agent LLM council for event-driven prediction markets"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "anthropic>=0.28",
    "ollama>=0.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tavily-python>=0.3",
    "python-dotenv>=1.0",
    "py-clob-client>=0.1",
    "aiosqlite>=0.20",
    "duckdb>=1.0",
    "rapidfuzz>=3.0",
]

# Console entry point: `uv run pqi <command>` (or just `pqi <command>` with the
# .venv activated) is equivalent to `python -m pqi.main <command>`.
[project.scripts]
pqi = "pqi.main:app"

# src layout: the `pqi` package lives under src/pqi/. A real build backend means
# `uv sync` installs pqi editable into .venv, so `import pqi` resolves from any
# working directory — no PYTHONPATH and no running-from-parent required. Docs,
# scripts/, and the tracked .pqi/ data dir stay outside the package at the root.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pqi"]
